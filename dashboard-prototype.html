<!doctype html>
<!-- PROTOTYPE: three dashboard variants for the scheduling copilot, switchable via ?variant=A|B|C. -->
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prototype · Agenda AI</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #172033; background: #f5f7fb; }
    * { box-sizing: border-box; } body { margin: 0; } button { font: inherit; cursor: pointer; }
    .shell { min-height: 100vh; display: grid; grid-template-columns: 230px 1fr; } aside { background: #172033; color: #dbe4f5; padding: 28px 18px; } .brand { color: white; font-weight: 800; font-size: 1.25rem; margin: 0 0 38px; } .brand b { color: #6ee7b7; } nav { display: grid; gap: 7px; } nav span { padding: 11px 12px; border-radius: 9px; } nav .active { background: #29435a; color: white; }
    main { padding: 32px clamp(20px, 4vw, 64px) 90px; max-width: 1350px; width: 100%; margin: auto; } .eyebrow { color: #087f5b; font-size: .82rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; } h1 { margin: 7px 0; font-size: clamp(1.8rem, 3vw, 2.8rem); } .muted { color: #667085; } .card { background: white; border: 1px solid #e1e7ef; border-radius: 16px; padding: 20px; box-shadow: 0 5px 16px #1720330a; } .button { background: #087f5b; color: white; border: 0; border-radius: 9px; padding: 12px 16px; font-weight: 700; } .secondary { background: white; color: #172033; border: 1px solid #cbd5e1; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 26px 0; } .stat strong { display: block; font-size: 2rem; margin-top: 9px; } .label { color: #667085; font-size: .9rem; }
    .request { display: grid; grid-template-columns: 1.15fr .85fr; gap: 18px; } .slot { display: block; width: 100%; text-align: left; padding: 12px; background: #f8fafc; border: 1px solid #dbe4f0; border-radius: 9px; margin: 8px 0; } .slot.selected { background: #dcfce7; border-color: #22c55e; font-weight: 700; } .action-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    .timeline { display: grid; grid-template-columns: 150px 1fr; gap: 20px; margin-top: 28px; } .hours { color: #667085; display: grid; gap: 54px; } .calendar { border-left: 2px solid #dbe4f0; padding-left: 20px; display: grid; gap: 18px; } .meeting { background: #e8f5ef; border-left: 4px solid #087f5b; padding: 16px; border-radius: 0 12px 12px 0; } .request-list { display: grid; gap: 10px; } .request-line { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 15px 0; border-bottom: 1px solid #e6ebf1; }
    .hub { display: grid; grid-template-columns: 1.25fr .75fr; gap: 20px; margin-top: 28px; } .hero { background: linear-gradient(125deg, #0f513d, #087f5b); color: white; padding: 38px; border-radius: 20px; } .hero h2 { font-size: 2rem; margin: 7px 0; } .service { border: 1px solid #e1e7ef; border-radius: 14px; padding: 18px; margin-top: 13px; } .service.active { border: 2px solid #087f5b; background: #f0fdf4; } .pill { display: inline-block; padding: 4px 8px; border-radius: 999px; background: #d1fae5; color: #065f46; font-size: .78rem; font-weight: 800; }
    .switcher { position: fixed; z-index: 2; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; background: #101828; color: white; padding: 8px 10px; border-radius: 999px; box-shadow: 0 10px 30px #10182866; } .switcher button { border: 0; border-radius: 50%; width: 34px; height: 34px; background: #344054; color: white; font-size: 1.25rem; } .switcher span { min-width: 155px; text-align: center; font-size: .9rem; }
    @media (max-width: 760px) { .shell { display: block; } aside { display: none; } main { padding: 26px 18px 90px; } .stats, .request, .hub { grid-template-columns: 1fr; } .timeline { grid-template-columns: 70px 1fr; } }
  </style>
</head>
<body>
  <div class="shell"><aside><p class="brand">Agenda <b>AI</b></p><nav><span class="active">Panoramica</span><span>Richieste</span><span>Calendario</span><span>Attività</span><span>Impostazioni</span></nav></aside><main id="app"></main></div>
  <div class="switcher"><button id="previous" aria-label="Variante precedente">‹</button><span id="name"></span><button id="next" aria-label="Variante successiva">›</button></div>
  <script>
    const variants = ["A", "B", "C"];
    const names = { A: "A — Decisione rapida", B: "B — Agenda di oggi", C: "C — Centro servizi" };
    let variant = new URLSearchParams(location.search).get("variant") || "A";
    if (!variants.includes(variant)) variant = "A";
    const app = document.querySelector("#app");
    const request = `<section class="card"><span class="eyebrow">Nuova scheduling request</span><h2>Giulia Bianchi vuole fissare un incontro</h2><p class="muted">“Vorrei discutere il progetto e capire le prossime attività.”</p><div class="action-row"><button class="button">Approva e invia</button><button class="button secondary">Modifica risposta</button></div></section>`;
    const slots = `<section class="card"><h2>Tre orari disponibili</h2><button class="slot selected">Mer 8 aprile · 09:00</button><button class="slot">Mer 8 aprile · 11:00</button><button class="slot">Mer 8 aprile · 14:00</button><p class="muted">Appuntamento da 30 minuti nel calendario dedicato.</p></section>`;
    function header(title, text) { return `<span class="eyebrow">Scheduling copilot</span><h1>${title}</h1><p class="muted">${text}</p>`; }
    function render() {
      document.querySelector("#name").textContent = names[variant];
      if (variant === "A") app.innerHTML = `${header("Buongiorno, Marco", "L’AI ha preparato la prossima risposta: tu mantieni il controllo.")}<div class="stats"><div class="card stat"><span class="label">Da revisionare</span><strong>3</strong></div><div class="card stat"><span class="label">Appuntamenti oggi</span><strong>5</strong></div><div class="card stat"><span class="label">Tempo risparmiato</span><strong>42 min</strong></div></div><div class="request">${request}${slots}</div>`;
      if (variant === "B") app.innerHTML = `${header("La tua agenda, con le richieste in attesa", "La giornata è la struttura principale; le richieste entrano dove c’è spazio.")}<div class="timeline"><div class="hours"><span>09:00</span><span>10:00</span><span>11:00</span><span>14:00</span></div><section class="calendar"><div class="meeting"><b>09:00 · Giulia Bianchi</b><br><span class="muted">Da approvare</span></div><div class="meeting"><b>11:00 · Revisione progetto</b><br><span class="muted">Appuntamento esistente</span></div><div class="meeting"><b>14:00 · Slot libero</b><br><span class="muted">Proposto dall’AI</span></div></section></div><section class="card"><h2>Richieste in attesa</h2><div class="request-list"><div class="request-line"><span><b>Giulia Bianchi</b><br><small>Richiesta appuntamento</small></span><button class="button">Apri</button></div><div class="request-line"><span><b>Luca Verdi</b><br><small>Vuole spostare l’incontro</small></span><button class="button secondary">Apri</button></div></div></section>`;
      if (variant === "C") app.innerHTML = `${header("Il tuo assistente per gli appuntamenti", "Un solo servizio attivo oggi: dalla scheduling request alla conferma.")}<div class="hub"><section class="hero"><span class="pill">Attivo</span><h2>Gestione appuntamenti</h2><p>L’AI legge la richiesta finta, propone tre orari, prepara la risposta e aspetta la tua Approval.</p><button class="button secondary">Apri le richieste</button></section><section class="card"><h2>Oggi</h2><p><b>3</b> richieste da revisionare</p><p><b>5</b> appuntamenti confermati</p><p><b>42 min</b> risparmiati</p></section></div><section class="card"><h2>Cosa fa Agenda AI</h2><div class="service active"><span class="pill">Ora</span><h3>Richieste e appuntamenti</h3><p>Propone orari, prepara risposte e crea l’evento solo dopo Approval.</p></div><div class="service"><span class="label">Non incluso nel primo prototipo</span><h3>Altri servizi AI</h3><p>Da definire solo dopo i test con gli operations lead.</p></div></section>`;
    }
    function move(delta) { variant = variants[(variants.indexOf(variant) + delta + variants.length) % variants.length]; history.replaceState({}, "", `?variant=${variant}`); render(); }
    document.querySelector("#previous").onclick = () => move(-1); document.querySelector("#next").onclick = () => move(1);
    addEventListener("keydown", (event) => { if (!["INPUT", "TEXTAREA"].includes(document.activeElement.tagName) && event.key === "ArrowLeft") move(-1); if (!["INPUT", "TEXTAREA"].includes(document.activeElement.tagName) && event.key === "ArrowRight") move(1); });
    render();
  </script>
</body>
</html>
